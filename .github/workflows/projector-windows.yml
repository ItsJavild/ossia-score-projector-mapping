name: Projector mapping Windows installer
on:
  workflow_dispatch:
  push:
    branches: [projector-mapping]
permissions:
  contents: read
concurrency:
  group: projector-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    needs: mapping-checks
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.357.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true
      - name: Install build dependencies and NDI add-on
        shell: bash
        run: ./ci/win32.deps.sh
      - name: Build application and installer
        shell: bash
        env:
          SCORE_EXTRA_CMAKE_ARGS: -DSCORE_TESTING=ON -DKFR_ARCH=generic
          SCORE_BUILD_TARGET: score
        run: ./ci/win32.build.sh
      - name: Check mapping serialization
        shell: bash
        run: |
          export PATH="/c/ossia-sdk-x86_64/llvm/bin:/c/ossia-sdk-x86_64/cmake/bin:$PATH"
          cmake --build build --target test_unit_output_mapping_serialization test_unit_device_inplace_settings
          ctest --test-dir build -R "output_mapping_serialization|device_inplace_settings" --output-on-failure --no-tests=error
      - name: Prepare USB package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force usb-package | Out-Null
          $installers = @(Get-ChildItem build -Filter 'ossia score-*-win64.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer" }
          Copy-Item $installers[0].FullName 'usb-package/Ossia-Score-Projector-Mapping-Windows-x64.exe'
          Copy-Item docs/ProjectorMapping.md usb-package/READ-ME.md
          Copy-Item LICENSE.txt usb-package/LICENSE.txt
          Get-FileHash usb-package/*.exe -Algorithm SHA256 | Format-List | Out-File usb-package/SHA256.txt
          git rev-parse HEAD | Out-File usb-package/SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Ossia-Score-Projector-Mapping-Windows-x64-USB
          path: usb-package/
          if-no-files-found: error

  mapping-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.*'
          modules: qtshadertools
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and exercise mapping editor
        shell: pwsh
        run: |
          cmake -S tests/projector-mapping -B mapping-checks -G Ninja
          cmake --build mapping-checks
          ctest --test-dir mapping-checks --output-on-failure --no-tests=error
          python tests/projector-mapping/check_shader.py
